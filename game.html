<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friendship Quiz 💕</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d9, #c9a7ff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 420px;
    background: rgba(255,255,255,0.95);
    padding: 30px 22px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
}

h1 {
    color: #ff4f9a;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

.question {
    font-size: 19px;
    font-weight: bold;
    color: #555;
    margin-bottom: 20px;
    line-height: 1.5;
}

.option {
    display: block;
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: none;
    border-radius: 15px;
    background: #ffe0ee;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.option:hover {
    background: #ffb6d9;
    transform: scale(1.03);
}

.option:disabled {
    cursor: default;
}

.correct {
    background: #b8f5c1 !important;
    color: #26733a !important;
}

.wrong {
    background: #ffc1c1 !important;
    color: #a83232 !important;
}

#result {
    margin-top: 15px;
    font-weight: bold;
    min-height: 55px;
    line-height: 1.5;
}

.next {
    display: none;
    margin-top: 15px;
    padding: 12px 25px;
    border: none;
    border-radius: 20px;
    background: #ff5fa2;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.next:hover {
    transform: scale(1.05);
}

.progress {
    color: #999;
    font-size: 14px;
    margin-bottom: 15px;
}

/* Hati */

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: naik 5s linear infinite;
    opacity: 0.7;
    z-index: 1;
}

@keyframes naik {

    from {
        transform: translateY(0);
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    to {
        transform: translateY(-110vh);
        opacity: 0;
    }

}

/* Confetti */

.confetti {
    position: fixed;
    top: -20px;
    font-size: 22px;
    z-index: 10;
    animation: jatuh 2s linear forwards;
}

@keyframes jatuh {

    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }

}

/* Animasi benar */

.benar {
    animation: bounce 0.5s;
}

@keyframes bounce {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

    100% {
        transform: scale(1);
    }

}

/* Animasi salah */

.salah {
    animation: shake 0.4s;
}

@keyframes shake {

    0%, 100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-8px);
    }

    50% {
        transform: translateX(8px);
    }

    75% {
        transform: translateX(-8px);
    }

}

</style>
</head>

<body>

<div class="card" id="card">

    <h1>🎀 Friendship Quiz 🎀</h1>

    <div class="subtitle">
        Seberapa kenal kamu dengan sahabatmu? 💕
    </div>

    <div class="progress" id="progress">
        Pertanyaan 1 dari 5
    </div>

    <div class="question" id="question">
        Pertanyaan akan muncul di sini
    </div>

    <div id="options"></div>

    <div id="result"></div>

    <button
        class="next"
        id="nextButton"
        onclick="nextQuestion()">

        Lanjut 💕
    </button>

</div>


<!-- Hati terbang -->

<div class="heart" style="left:5%; animation-delay:0s;">💗</div>
<div class="heart" style="left:20%; animation-delay:2s;">💕</div>
<div class="heart" style="left:40%; animation-delay:1s;">💖</div>
<div class="heart" style="left:60%; animation-delay:3s;">💗</div>
<div class="heart" style="left:80%; animation-delay:1.5s;">💕</div>
<div class="heart" style="left:95%; animation-delay:4s;">💖</div>


<script>

/* =================================
   PERTANYAAN QUIZ
================================= */

const questions = [

    {
        question: "Apa yang paling sering kita lakukan bersama? 😆",

        options: [
            "Main game bareng 🎮",
            "Belanja setiap hari 🛍️",
            "Olahraga bersama 🏃",
            "Masak bersama 🍳"
        ],

        answer: 0
    },


    {
        question: "Kalau kita sedang ketemu, biasanya paling banyak... 😂",

        options: [
            "Diam 🤐",
            "Tertawa 🤣",
            "Tidur 😴",
            "Belajar 📚"
        ],

        answer: 1
    },


    {
        question: "Apa yang paling penting dalam persahabatan kita? 💕",

        options: [
            "Saling menjauh 😭",
            "Saling bertengkar 😤",
            "Saling mendukung 🤝",
            "Tidak saling peduli 😶"
        ],

        answer: 2
    },


    {
        question: "Kalau sahabat sedang sedih, apa yang harus dilakukan? 🥺",

        options: [
            "Ditinggalkan 😶",
            "Dimarahi 😤",
            "Dibiarkan sendiri 😭",
            "Ditemani dan didengarkan 💗"
        ],

        answer: 3
    },


    {
        question: "Apakah persahabatan kita akan tetap selamanya? 🥹💕",

        options: [
            "Tidak 😭",
            "Mungkin 🤔",
            "Entahlah 😶",
            "Iyaaa! ❤️"
        ],

        answer: 3
    },

    {
    question: "Kalau kita lagi gabut, kemungkinan besar kita bakal... 😭😂",

    options: [
        "Tidur seharian 😴",
        "Main game bareng 🎮",
        "Pergi olahraga 🏃",
        "Baca buku 📚"
    ],

    answer: 1
},

{
    question: "Kalau aku bilang 'aku punya cerita', kamu biasanya... 👀",

    options: [
        "Langsung menghilang 🏃",
        "Pura-pura tidak dengar 🤐",
        "Langsung kepo dan siap dengerin 👂😂",
        "Langsung tidur 😴"
    ],

    answer: 2
},

{
    question: "Kalau kita foto bareng, biasanya yang terjadi adalah... 📸🤣",

    options: [
        "Cuma sekali foto langsung bagus ✨",
        "Foto berkali-kali sampai dapat yang bagus 😂",
        "Tidak pernah foto",
        "Selalu serius 😐"
    ],

    answer: 1
},

{
    question: "Kalau salah satu dari kita punya masalah, yang paling mungkin terjadi... 🥺💗",

    options: [
        "Saling cuek 😶",
        "Saling menyalahkan 😤",
        "Saling menghilang 😭",
        "Saling cerita dan kasih semangat 🤝💕"
    ],

    answer: 3
},

{
    question: "Kalau suatu hari kita sudah tua, kita masih bakal... 🥹❤️",

    options: [
        "Tetap saling cerita dan ketawa bareng 😂",
        "Tidak saling kenal 😭",
        "Saling blokir 🤣",
        "Lupa satu sama lain 😶"
    ],

    answer: 0
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


/* =================================
   MENAMPILKAN PERTANYAAN
================================= */

function showQuestion() {

    answered = false;

    const q = questions[currentQuestion];


    document.getElementById("progress").innerText =
        "Pertanyaan " +
        (currentQuestion + 1) +
        " dari " +
        questions.length;


    document.getElementById("question").innerText =
        q.question;


    document.getElementById("result").innerHTML = "";


    document.getElementById("nextButton").style.display =
        "none";


    const optionsDiv =
        document.getElementById("options");


    optionsDiv.innerHTML = "";


    q.options.forEach(function(option, index) {

        const button =
            document.createElement("button");


        button.className = "option";


        button.innerText = option;


        button.onclick = function() {

            checkAnswer(index);

        };


        optionsDiv.appendChild(button);

    });

}


/* =================================
   CEK JAWABAN
================================= */

function checkAnswer(selected) {

    if (answered) {
        return;
    }

    answered = true;


    const q = questions[currentQuestion];

    const result =
        document.getElementById("result");

    const buttons =
        document.querySelectorAll(".option");


    /* Kunci semua jawaban */

    buttons.forEach(function(button) {

        button.disabled = true;

    });


    /* =========================
       JAWABAN BENAR
    ========================= */

    if (selected === q.answer) {

        score++;


        buttons[selected]
            .classList.add("correct");


        result.innerHTML =
            "🎉 <b>YEAYYY BENAR!</b> 🥳💖<br>" +
            "Kamu tahu banget tentang kita! 💕";


        result.style.color = "#26733a";


        document.getElementById("card")
            .classList.add("benar");


        buatConfetti();


        setTimeout(function() {

            document.getElementById("card")
                .classList.remove("benar");

        }, 500);

    }


    /* =========================
       JAWABAN SALAH
    ========================= */

    else {

        buttons[selected]
            .classList.add("wrong");


        buttons[q.answer]
            .classList.add("correct");


        result.innerHTML =
            "❌ <b>YAHHH SALAH! 😝</b><br>" +
            "Jawaban yang benar berwarna hijau 💚";


        result.style.color = "#a83232";


        document.getElementById("card")
            .classList.add("salah");


        setTimeout(function() {

            document.getElementById("card")
                .classList.remove("salah");

        }, 400);

    }


    /* Tampilkan tombol lanjut */

    document.getElementById("nextButton")
        .style.display = "inline-block";

}


/* =================================
   CONFETTI
================================= */

function buatConfetti() {

    const emoji =
        ["🎉", "✨", "💕", "💖", "🎊", "🥳"];


    for (let i = 0; i < 25; i++) {

        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.innerText =
            emoji[Math.floor(
                Math.random() * emoji.length
            )];


        confetti.style.left =
            Math.random() * 100 + "%";


        confetti.style.animationDuration =
            (1.5 + Math.random() * 1.5) + "s";


        document.body.appendChild(confetti);


        setTimeout(function() {

            confetti.remove();

        }, 3000);

    }

}


/* =================================
   PERTANYAAN BERIKUTNYA
================================= */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();

    }

    else {

        showFinalResult();

    }

}


/* =================================
   HASIL AKHIR
================================= */

function showFinalResult() {

    const card =
        document.getElementById("card");


    let message;


    if (score === 5) {

        message =
            "WAAAWWW! BENAR SEMUA! 🥳💖";

    }

    else if (score >= 3) {

        message =
            "Wahhh, kamu cukup mengenal kita! 🥰💕";

    }

    else {

        message =
            "Hehehe, harus lebih banyak main bareng nih! 😝💗";

    }


    card.innerHTML = `

        <h1>🎉 Quiz Selesai! 🎉</h1>

        <p style="font-size:20px;">
            Skor kamu:
        </p>

        <p style="
            font-size:45px;
            color:#ff4f9a;
            font-weight:bold;
        ">
            ${score} / ${questions.length}
        </p>

        <p style="
            color:#666;
            font-size:17px;
        ">
            ${message}
        </p>

        <p style="color:#777;">
            Terima kasih sudah bermain 💕
        </p>

        <button
            onclick="location.href='pesan.html'"
            style="
                margin-top:15px;
                padding:13px 25px;
                border:none;
                border-radius:20px;
                background:#ff5fa2;
                color:white;
                font-size:16px;
                cursor:pointer;
            "
        >
            Buka Pesan 💌
        </button>

    `;


    buatConfetti();

}


/* =================================
   MULAI GAME
================================= */

showQuestion();

</script>

</body>
</html>
